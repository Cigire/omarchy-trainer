<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Omarchy">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Omarchy Trainer</title>
<style>
/* Layout: one-screen phone app. Header with progress, scrolling stage, bottom tab bar. Keycaps are the main visual device. */
:root{
  --bg:#eef0f6; --surface:#ffffff; --raised:#e3e6f0; --fg:#1b1f33; --muted:#5d6482;
  --accent:#3b5bdb; --accent-fg:#ffffff; --good:#17803d; --bad:#c2312d; --line:#cfd4e4;
  --cap:#f7f8fc; --cap-edge:#b9bfd6;
  --display:-apple-system,"SF Pro Rounded",system-ui,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,"JetBrains Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161f; --surface:#1d2030; --raised:#262a3f; --fg:#e6e9f5; --muted:#9097b5;
  --accent:#8aa4ff; --accent-fg:#10142a; --good:#6fd08c; --bad:#ff8a84; --line:#2e3350;
  --cap:#2b3050; --cap-edge:#0d0f18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161f; --surface:#1d2030; --raised:#262a3f; --fg:#e6e9f5; --muted:#9097b5;
  --accent:#8aa4ff; --accent-fg:#10142a; --good:#6fd08c; --bad:#ff8a84; --line:#2e3350;
  --cap:#2b3050; --cap-edge:#0d0f18; color-scheme:dark}
html,body{height:100%;margin:0}
html{padding:env(safe-area-inset-top,0px) 0 0;-webkit-text-size-adjust:100%;color-scheme:light dark}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:16px;line-height:1.45;overflow-x:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{padding:14px 16px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:1.15rem;font-weight:800;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.stat{font:500 .8rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
main{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 16px;-webkit-overflow-scrolling:touch}
nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;color:var(--muted);font:600 .8rem var(--display);padding:14px 4px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
nav button[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:7px 13px;font:600 .82rem var(--display);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 18px;min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.cat{font:700 .72rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.q{font-size:1.45rem;font-weight:800;line-height:1.2;text-wrap:balance;margin:0}
.ans{display:flex;flex-direction:column;gap:12px;min-width:0}
.keys{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.k{font:700 .95rem var(--mono);background:var(--cap);border:1px solid var(--cap-edge);border-bottom-width:3px;border-radius:6px;padding:5px 9px;min-width:2.1em;text-align:center}
.plus{color:var(--muted);font:500 .9rem var(--mono)}
code.cmd{font:700 .95rem var(--mono);background:var(--raised);border-radius:8px;padding:10px 12px;display:block;overflow-x:auto;white-space:nowrap}
.hint{color:var(--muted);font-size:.85rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{border:0;border-radius:12px;padding:15px;font:700 1rem var(--display);cursor:pointer;background:var(--raised);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.good{background:var(--good);color:var(--bg)} .btn.bad{background:var(--bad);color:var(--bg)}
.btn.wide{grid-column:1/-1}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:13px 14px;cursor:pointer;min-width:0;font:600 1rem var(--display)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.opt .keys{pointer-events:none}
.opt code{font:700 .88rem var(--mono);overflow-wrap:anywhere}
.bar{height:6px;background:var(--raised);border-radius:99px;overflow:hidden;margin:2px 0 14px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
input[type=search]{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px 14px;font:500 1rem var(--display);margin-bottom:12px}
.list{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px;min-width:0}
.item:first-child{border-top:0}
.item b{font-weight:600}
.item .mast{font:500 .72rem var(--mono);color:var(--muted)}
.done{text-align:center;display:grid;gap:14px;padding:30px 0}
.done .big{font:800 3rem var(--display);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>
<div id="app">
  <header><h1>Omarchy <span>Trainer</span></h1><div class="stat" id="stat"></div></header>
  <main id="stage"></main>
  <nav role="tablist" id="tabs">
    <button role="tab" data-t="learn">Learn</button>
    <button role="tab" data-t="quiz">Quiz</button>
    <button role="tab" data-t="browse">Browse</button>
  </nav>
</div>
<script>
// "category|what it does|keys or command". Keys use + ; commands start with omarchy-
const RAW=`Apps|Open a terminal|SUPER+RETURN
Apps|Open the browser|SUPER+SHIFT+RETURN
Apps|Open the file manager|SUPER+SHIFT+F
Apps|Open the file manager in the current directory|SUPER+ALT+SHIFT+F
Apps|Open a private browser window|SUPER+SHIFT+ALT+B
Apps|Open the editor|SUPER+SHIFT+N
Apps|Open tmux|SUPER+ALT+RETURN
Apps|Open Spotify|SUPER+SHIFT+M
Apps|Open the Docker TUI|SUPER+SHIFT+D
Apps|Open Signal|SUPER+SHIFT+G
Apps|Open Obsidian|SUPER+SHIFT+O
Apps|Open the password manager|SUPER+SHIFT+SLASH
Apps|Open ChatGPT|SUPER+SHIFT+A
Apps|Open Calendar|SUPER+SHIFT+C
Apps|Open Email|SUPER+SHIFT+E
Apps|Open YouTube|SUPER+SHIFT+Y
Apps|Open Google Maps|SUPER+SHIFT+S
Menus|Open the Omarchy menu|SUPER+SPACE
Menus|Open the apps launcher|SUPER+ALT+SPACE
Menus|Open the system menu|SUPER+ESCAPE
Menus|Show all keybindings|SUPER+K
Menus|Show tmux keybindings|SUPER+ALT+K
Menus|Open the emoji picker|SUPER+CTRL+E
Menus|Open the capture menu|SUPER+CTRL+C
Menus|Open the toggle menu|SUPER+CTRL+O
Menus|Open the hardware menu|SUPER+CTRL+H
Menus|Open the theme menu|SUPER+SHIFT+CTRL+SPACE
Menus|Open the background switcher|SUPER+CTRL+SPACE
Menus|Open the share menu|SUPER+CTRL+S
Windows|Close the window|SUPER+W
Windows|Close all windows|CTRL+ALT+DELETE
Windows|Toggle floating and tiling|SUPER+T
Windows|Full screen|SUPER+F
Windows|Tiled full screen|SUPER+CTRL+F
Windows|Full width (maximize)|SUPER+ALT+F
Windows|Pop the window out (float and pin)|SUPER+O
Windows|Toggle the window split direction|SUPER+J
Windows|Make the window pseudo-tiled|SUPER+P
Windows|Toggle the workspace layout|SUPER+L
Windows|Toggle window transparency|SUPER+BACKSPACE
Windows|Toggle window gaps|SUPER+SHIFT+BACKSPACE
Windows|Focus the window on the left|SUPER+LEFT
Windows|Focus the window on the right|SUPER+RIGHT
Windows|Focus the window above|SUPER+UP
Windows|Focus the window below|SUPER+DOWN
Windows|Swap the window to the left|SUPER+SHIFT+LEFT
Windows|Focus the next window|ALT+TAB
Windows|Focus the previous window|ALT+SHIFT+TAB
Windows|Expand the window to the left|SUPER+MINUS
Windows|Shrink the window to the left|SUPER+EQUAL
Windows|Move a window with the mouse|SUPER+MOUSE LEFT
Windows|Resize a window with the mouse|SUPER+MOUSE RIGHT
Workspaces|Switch to workspace 1 to 10|SUPER+1…0
Workspaces|Move the window to workspace 1 to 10|SUPER+SHIFT+1…0
Workspaces|Move the window silently to a workspace|SUPER+SHIFT+ALT+1…0
Workspaces|Next workspace|SUPER+TAB
Workspaces|Previous workspace|SUPER+SHIFT+TAB
Workspaces|Former workspace|SUPER+CTRL+TAB
Workspaces|Toggle the scratchpad|SUPER+S
Workspaces|Move the window to the scratchpad|SUPER+ALT+S
Workspaces|Move the workspace to the left monitor|SUPER+SHIFT+ALT+LEFT
Workspaces|Focus the next monitor|CTRL+ALT+TAB
Groups|Toggle window grouping|SUPER+G
Groups|Move the window out of its group|SUPER+ALT+G
Groups|Next window in the group|SUPER+ALT+TAB
Groups|Move the window into the group on the left|SUPER+ALT+LEFT
Groups|Switch to group window 1 to 5|SUPER+ALT+1…5
Capture|Take a screenshot|PRINT
Capture|Record the screen|ALT+PRINT
Capture|Pick a color|SUPER+PRINT
Capture|Extract text (OCR) from the screen|SUPER+CTRL+PRINT
Capture|Make the webcam overlay larger|SUPER+ALT+]
Clipboard|Universal copy|SUPER+C
Clipboard|Universal paste|SUPER+V
Clipboard|Universal cut|SUPER+X
Clipboard|Open the clipboard manager|SUPER+CTRL+V
Utilities|Toggle the top bar|SUPER+SHIFT+SPACE
Utilities|Toggle the nightlight|SUPER+CTRL+N
Utilities|Toggle locking on idle|SUPER+CTRL+I
Utilities|Lock the system|SUPER+CTRL+L
Utilities|Open the calculator|SUPER+CTRL+Q
Utilities|Open the activity monitor (btop)|SUPER+CTRL+T
Utilities|Set a reminder|SUPER+CTRL+R
Utilities|Show reminders|SUPER+CTRL+ALT+R
Utilities|Show the time|SUPER+CTRL+ALT+T
Utilities|Show battery remaining|SUPER+CTRL+ALT+B
Utilities|Zoom in|SUPER+CTRL+Z
Utilities|Reset zoom|SUPER+CTRL+ALT+Z
Utilities|Scale the monitor up|SUPER+SLASH
Utilities|Toggle dictation|SUPER+CTRL+X
Notifications|Dismiss the last notification|SUPER+COMMA
Notifications|Dismiss all notifications|SUPER+SHIFT+COMMA
Notifications|Silence notifications|SUPER+CTRL+COMMA
Notifications|Invoke the last notification|SUPER+ALT+COMMA
Notifications|Open notification history|SUPER+SHIFT+ALT+COMMA
Panels|Open the audio panel|SUPER+CTRL+A
Panels|Open the Bluetooth panel|SUPER+CTRL+B
Panels|Open the display panel|SUPER+CTRL+D
Panels|Open the network panel|SUPER+CTRL+W
Panels|Open the power panel|SUPER+CTRL+P
Panels|Open the calendar panel|SUPER+CTRL+ALT+D
Commands|Update Omarchy|omarchy-update
Commands|Show the Omarchy version|omarchy-version
Commands|Open the Omarchy menu from the terminal|omarchy-menu
Commands|Set the theme|omarchy-theme-set
Commands|List the available themes|omarchy-theme-list
Commands|Show the current theme|omarchy-theme-current
Commands|Install a theme|omarchy-theme-install
Commands|Switch to the next wallpaper|omarchy-theme-bg-next
Commands|Set the system font|omarchy-font-set
Commands|List the available fonts|omarchy-font-list
Commands|Install a package|omarchy-pkg-install
Commands|Install a package from the AUR|omarchy-pkg-aur-install
Commands|Remove a package|omarchy-pkg-remove
Commands|Check whether a package is installed|omarchy-pkg-present
Commands|Install a web app|omarchy-webapp-install
Commands|Remove a web app|omarchy-webapp-remove
Commands|Take a screenshot|omarchy-capture-screenshot
Commands|Record the screen|omarchy-capture-screenrecording
Commands|Extract text from a screen region|omarchy-capture-text
Commands|Toggle the nightlight|omarchy-toggle-nightlight
Commands|Toggle locking on idle|omarchy-toggle-idle
Commands|Toggle the touchpad|omarchy-toggle-touchpad
Commands|Lock the screen|omarchy-system-lock
Commands|Reboot the machine|omarchy-system-reboot
Commands|Shut the machine down|omarchy-system-shutdown
Commands|Log out|omarchy-system-logout
Commands|Restart Wi-Fi|omarchy-restart-wifi
Commands|Restart Bluetooth|omarchy-restart-bluetooth
Commands|Restart audio|omarchy-restart-audio
Commands|Run a network speed test|omarchy-network-speedtest
Commands|Set the power profile|omarchy-powerprofiles-set
Commands|List the power profiles|omarchy-powerprofiles-list
Commands|Set the display brightness|omarchy-brightness-display
Commands|Change the audio output volume|omarchy-audio-output-volume
Commands|Switch the audio output|omarchy-audio-output-switch
Commands|Set a reminder from the terminal|omarchy-reminder
Commands|Launch the browser|omarchy-launch-browser
Commands|Launch the editor|omarchy-launch-editor
Commands|Pop the window out (float and pin)|omarchy-hyprland-window-pop
Commands|Toggle window gaps|omarchy-hyprland-window-gaps-toggle
Commands|Toggle window transparency|omarchy-hyprland-window-transparency-toggle
Commands|Set up fingerprint login|omarchy-setup-security-fingerprint
Commands|Set up a FIDO2 key|omarchy-setup-security-fido2
Commands|Set up hibernation|omarchy-hibernation-setup
Commands|Update the firmware|omarchy-update-firmware
Commands|Install a development environment|omarchy-install-dev-env
Commands|Install a browser|omarchy-install-browser
Commands|Install a Docker database|omarchy-install-docker-dbs
Commands|Show drive information|omarchy-drive-info
Commands|Run a disk speed test|omarchy-disk-speedtest
Commands|Restart the terminal|omarchy-restart-terminal
Commands|Reload the Hyprland configuration|omarchy-refresh-hyprland`;
const ITEMS=RAW.split("\n").map((l,i)=>{const [cat,q,a]=l.split("|");return{id:i,cat,q,a,cmd:a.startsWith("omarchy-")}});
const CATS=[...new Set(ITEMS.map(i=>i.cat))];
const $=s=>document.querySelector(s), stage=$("#stage");
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let boxes=store.get("boxes",{}), streak=store.get("streak",0), tab=store.get("tab","learn"), cat=store.get("cat","All"), best=store.get("best",0);
const box=i=>boxes[i.id]||0, learned=()=>ITEMS.filter(i=>box(i)>=3).length;
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const pool=()=>ITEMS.filter(i=>cat==="All"||i.cat===cat);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pretty=k=>k==="SUPER"?"Super":k.length>1&&!/^\d/.test(k)?k[0]+k.slice(1).toLowerCase():k;
function ans(i){return i.cmd?`<code class="cmd">${esc(i.a)}</code>`:`<div class="keys">${i.a.split("+").map((k,n)=>(n?'<span class="plus">+</span>':"")+`<span class="k">${esc(pretty(k))}</span>`).join("")}</div>`}
function pick(items){ // weighted toward low boxes
  const w=items.map(i=>[i,Math.pow(.45,box(i))]), t=w.reduce((s,x)=>s+x[1],0);let r=Math.random()*t;
  for(const[x,v]of w){if((r-=v)<=0)return x}return items[0]}
function setStat(){$("#stat").textContent=`${learned()}/${ITEMS.length} learned`}
function chips(){return `<div class="chips">${["All",...CATS].map(c=>`<button aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("")}</div>`}
function bindChips(r){stage.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{cat=b.dataset.c;store.set("cat",cat);r()})}
function save(){store.set("boxes",boxes);setStat()}

function learn(){
  const it=pick(pool()); let shown=false;
  const draw=()=>{stage.innerHTML=chips()+`<div class="bar"><i style="width:${learned()/ITEMS.length*100}%"></i></div>
   <div class="card"><div class="cat">${it.cat} · ${it.cmd?"command":"shortcut"}</div><p class="q">${esc(it.q)}</p>
   ${shown?`<div class="ans">${ans(it)}</div>`:`<div class="hint">Say it out loud, then reveal.</div>`}</div>
   <div class="row">${shown?`<button class="btn bad" id="no">Again</button><button class="btn good" id="yes">Got it</button>`:`<button class="btn primary wide" id="show">Show answer</button>`}</div>`;
   bindChips(learn);
   const g=id=>$(id);
   if(shown){g("#yes").onclick=()=>{boxes[it.id]=Math.min(4,box(it)+1);save();learn()};g("#no").onclick=()=>{boxes[it.id]=0;save();learn()}}
   else g("#show").onclick=()=>{shown=true;draw()}};
  draw()}

function quiz(){
  const items=shuffle(pool()).slice(0,10); let n=0,score=0;
  const next=()=>{
    if(n>=items.length){best=Math.max(best,score);store.set("best",best);
      stage.innerHTML=chips()+`<div class="done"><div class="hint">Round complete</div><div class="big">${score}/${items.length}</div><div class="hint">Best round: ${best}</div><button class="btn primary" id="again">Another round</button></div>`;bindChips(quiz);$("#again").onclick=quiz;return}
    const it=items[n], rev=Math.random()<.35; // rev: show answer, pick the action
    const same=ITEMS.filter(x=>x.cmd===it.cmd&&x.a!==it.a&&x.q!==it.q), seen=new Set([rev?it.q:it.a]);
    const wrong=[];for(const x of shuffle(same)){const key=rev?x.q:x.a;if(!seen.has(key)){seen.add(key);wrong.push(x)}if(wrong.length===3)break}
    const opts=shuffle([it,...wrong]);
    stage.innerHTML=chips()+`<div class="bar"><i style="width:${n/items.length*100}%"></i></div>
     <div class="card"><div class="cat">Question ${n+1} of ${items.length}</div>
     ${rev?`<p class="q">What does this do?</p><div class="ans">${ans(it)}</div>`:`<p class="q">${esc(it.q)}</p>`}</div>
     <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${rev?esc(o.q):o.cmd?`<code>${esc(o.a)}</code>`:ans(o)}</button>`).join("")}</div>`;
    bindChips(quiz);
    stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const ok=opts[b.dataset.k]===it;
      stage.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(opts[x.dataset.k]===it)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      boxes[it.id]=ok?Math.min(4,box(it)+1):0;score+=ok;streak=ok?streak+1:0;store.set("streak",streak);save();
      setTimeout(()=>{n++;next()},ok?650:1700)})};
  next()}

function browse(){
  let q="";
  const draw=()=>{const f=pool().filter(i=>(i.q+i.a+i.cat).toLowerCase().includes(q));
    stage.innerHTML=`<input type="search" id="q" placeholder="Search ${ITEMS.length} shortcuts and commands" value="${esc(q)}">`+chips()+
    `<div class="list">${f.map(i=>`<div class="item"><b>${esc(i.q)}</b>${ans(i)}<span class="mast">${i.cat} · box ${box(i)+1}/5</span></div>`).join("")||'<div class="item hint">Nothing matches.</div>'}</div>`;
    const inp=$("#q");inp.oninput=()=>{q=inp.value.toLowerCase();const p=inp.selectionStart;draw();const n=$("#q");n.focus();n.setSelectionRange(p,p)};
    bindChips(draw)};
  draw()}

function show(t){tab=t;store.set("tab",t);document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));
  stage.scrollTop=0;({learn,quiz,browse})[t]()}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>show(b.dataset.t));
setStat();show(tab);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>

</body></html>
